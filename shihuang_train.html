<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>始皇巡游号 - 3D等距低多边形交互动画</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            overflow: hidden;
            background: linear-gradient(180deg, #d8f3dc 0%, #b7e4c7 40%, #95d5b2 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            color: #fff;
            width: 100vw;
            height: 100vh;
        }
        #scene-viewport {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: grab;
            position: relative;
        }
        #scene-viewport:active {
            cursor: grabbing;
        }
        #stage-transform {
            transform-origin: center center;
            transition: transform 0.08s ease-out;
            will-change: transform;
        }
        svg {
            display: block;
            filter: drop-shadow(0 20px 30px rgba(18, 53, 36, 0.25));
        }

        /* --- UI 样式 --- */
        .glass-card {
            background: rgba(18, 24, 38, 0.75);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            box-shadow: 0 10px 32px rgba(0, 0, 0, 0.4);
            color: #f1f5f9;
            z-index: 100;
        }
        #top-left-panel {
            position: absolute;
            top: 24px;
            left: 24px;
            padding: 14px 20px;
            pointer-events: auto;
        }
        #top-left-panel h1 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #ffd700, #ffb703, #d97706);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
        }
        #top-left-panel .subtitle {
            font-size: 12px;
            color: #94a3b8;
            letter-spacing: 0.5px;
        }

        #bottom-control-panel {
            position: absolute;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 18px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
            pointer-events: auto;
            min-width: 320px;
        }
        .btn-row {
            display: flex;
            gap: 10px;
            width: 100%;
        }
        .ctrl-btn {
            flex: 1;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: #f8fafc;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            white-space: nowrap;
        }
        .ctrl-btn:hover {
            background: rgba(217, 119, 6, 0.4);
            border-color: #f59e0b;
            transform: translateY(-2px);
        }
        .ctrl-btn.active {
            background: rgba(217, 119, 6, 0.6);
            border-color: #fbbf24;
            color: #fff;
        }
        .btn-pause {
            width: 100%;
            background: rgba(239, 68, 68, 0.25);
            border-color: rgba(239, 68, 68, 0.4);
        }
        .btn-pause:hover {
            background: rgba(239, 68, 68, 0.45);
            border-color: #ef4444;
        }

        /* --- 动画关键帧 --- */
        /* 车轮旋转 */
        .wheel-rotate {
            transform-box: fill-box;
            transform-origin: center;
            animation: rotateWheels 0.6s linear infinite;
        }
        @keyframes rotateWheels {
            from { transform: rotate(0deg); }
            to { transform: rotate(-360deg); }
        }

        /* 蒸汽白烟升腾消散动画 */
        .steam-puff {
            opacity: 0;
            transform-origin: 200px 320px;
            animation: puffRise 2.4s cubic-bezier(0.2, 0.6, 0.4, 1) infinite;
        }
        .puff-1 { animation-delay: 0s; }
        .puff-2 { animation-delay: 0.8s; }
        .puff-3 { animation-delay: 1.6s; }

        @keyframes puffRise {
            0% {
                opacity: 0.85;
                transform: translate(0, 0) scale(0.4);
            }
            50% {
                opacity: 0.6;
                transform: translate(40px, -45px) scale(1.1);
            }
            100% {
                opacity: 0;
                transform: translate(90px, -95px) scale(1.8);
            }
        }

        /* 车身轻微颠簸感 */
        .train-chug {
            animation: trainJitter 0.3s ease-in-out infinite alternate;
        }
        @keyframes trainJitter {
            from { transform: translateY(0); }
            to { transform: translateY(-1.5px); }
        }

        /* 背景农田向右流动，形成火车向左行驶的视觉相对运动 */
        .ground-scroll {
            animation: scrollLandscape 3s linear infinite;
        }
        @keyframes scrollLandscape {
            from { transform: translate(0, 0); }
            to { transform: translate(115.47px, 66.67px); }
        }

        /* 鸣笛屏幕震动效果 */
        .screen-shake {
            animation: shakeScreen 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }
        @keyframes shakeScreen {
            10%, 90% { transform: translate3d(-2px, -1px, 0); }
            20%, 80% { transform: translate3d(3px, 2px, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, -3px, 0); }
            40%, 60% { transform: translate3d(4px, 3px, 0); }
        }

        /* 飘动音符 */
        .note-float {
            position: absolute;
            font-size: 24px;
            color: #ffd700;
            pointer-events: none;
            z-index: 150;
            animation: floatUp 1.2s ease-out forwards;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translate(0, 0) scale(0.6) rotate(0deg); }
            100% { opacity: 0; transform: translate(40px, -90px) scale(1.3) rotate(25deg); }
        }

        /* 暂停类控制 */
        .paused * {
            animation-play-state: paused !important;
        }
    </style>
</head>
<body>
    <div id="top-left-panel" class="glass-card">
        <h1>始皇巡游号</h1>
        <div class="subtitle">自由视角 · 拖动旋转，滚轮缩放</div>
    </div>

    <div id="bottom-control-panel" class="glass-card">
        <div class="btn-row">
            <button class="ctrl-btn active" id="btn-camera">镜头：自由视角</button>
            <button class="ctrl-btn" id="btn-whistle">📢 鸣笛</button>
            <button class="ctrl-btn" id="btn-sound">声音：关</button>
        </div>
        <button class="ctrl-btn btn-pause" id="btn-pause">⏸ 暂停</button>
    </div>

    <div id="scene-viewport">
        <div id="stage-transform">
            <svg id="svg-stage" width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <!-- 金色高光渐变 -->
                    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#fff176" />
                        <stop offset="50%" stop-color="#fbc02d" />
                        <stop offset="100%" stop-color="#d4af37" />
                    </linearGradient>

                    <!-- 秦帝国黑金车体质感 -->
                    <linearGradient id="bodyBlack" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#2c3038" />
                        <stop offset="100%" stop-color="#181a20" />
                    </linearGradient>

                    <!-- 大秦朱红车厢渐变 -->
                    <linearGradient id="imperialRed" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#dc2626" />
                        <stop offset="100%" stop-color="#991b1b" />
                    </linearGradient>

                    <!-- 中式飞檐深色瓦当 -->
                    <linearGradient id="roofDark" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#3f3f46" />
                        <stop offset="100%" stop-color="#18181b" />
                    </linearGradient>

                    <!-- 蒸汽云雾柔和渐变 -->
                    <radialGradient id="steamGrad" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
                        <stop offset="60%" stop-color="#f8fafc" stop-opacity="0.5" />
                        <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0" />
                    </radialGradient>

                    <!-- 兵马俑陶土质感 -->
                    <linearGradient id="terracotta" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#9a6744" />
                        <stop offset="100%" stop-color="#6e4629" />
                    </linearGradient>
                </defs>

                <!-- ================= 1. 等距农田与流动地块 ================= -->
                <g id="ground-system">
                    <!-- 底层农田大背景 -->
                    <polygon points="600,60 1200,410 600,760 0,410" fill="#74c69d" opacity="0.6"/>

                    <!-- 流动的网格田块组 -->
                    <g class="ground-scroll" id="scrolling-tiles">
                        <!-- 田块方阵 -->
                        <!-- Row 1 -->
                        <polygon points="300,200 450,285 300,370 150,285" fill="#95d5b2" stroke="#52b788" stroke-width="2"/>
                        <polygon points="500,200 650,285 500,370 350,285" fill="#74c69d" stroke="#52b788" stroke-width="2"/>
                        <polygon points="700,200 850,285 700,370 550,285" fill="#95d5b2" stroke="#52b788" stroke-width="2"/>
                        <polygon points="900,200 1050,285 900,370 750,285" fill="#52b788" stroke="#40916c" stroke-width="2"/>

                        <!-- Row 2 -->
                        <polygon points="200,260 350,345 200,430 50,345" fill="#52b788" stroke="#40916c" stroke-width="2"/>
                        <polygon points="400,260 550,345 400,430 250,345" fill="#95d5b2" stroke="#52b788" stroke-width="2"/>
                        <polygon points="600,260 750,345 600,430 450,345" fill="#74c69d" stroke="#52b788" stroke-width="2"/>
                        <polygon points="800,260 950,345 800,430 650,345" fill="#95d5b2" stroke="#52b788" stroke-width="2"/>
                        <polygon points="1000,260 1150,345 1000,430 850,345" fill="#74c69d" stroke="#52b788" stroke-width="2"/>

                        <!-- Row 3 -->
                        <polygon points="300,320 450,405 300,490 150,405" fill="#74c69d" stroke="#52b788" stroke-width="2"/>
                        <polygon points="500,320 650,405 500,490 350,405" fill="#52b788" stroke="#40916c" stroke-width="2"/>
                        <polygon points="700,320 850,405 700,490 550,405" fill="#95d5b2" stroke="#52b788" stroke-width="2"/>
                        <polygon points="900,320 1050,405 900,490 750,405" fill="#74c69d" stroke="#52b788" stroke-width="2"/>

                        <!-- Row 4 -->
                        <polygon points="400,380 550,465 400,550 250,465" fill="#95d5b2" stroke="#52b788" stroke-width="2"/>
                        <polygon points="600,380 750,465 600,550 450,465" fill="#74c69d" stroke="#52b788" stroke-width="2"/>
                        <polygon points="800,380 950,465 800,550 650,465" fill="#52b788" stroke="#40916c" stroke-width="2"/>

                        <!-- 低多边形树木 (Low-poly Conical Trees) -->
                        <!-- Tree 1 -->
                        <g transform="translate(260, 280)">
                            <polygon points="0,0 12,-6 -12,-6" fill="#1b4332" opacity="0.4"/>
                            <polygon points="0,-40 -18,-10 0,-5" fill="#2d6a4f"/>
                            <polygon points="0,-40 0,-5 18,-10" fill="#40916c"/>
                            <polygon points="0,-60 -14,-32 0,-28" fill="#40916c"/>
                            <polygon points="0,-60 0,-28 14,-32" fill="#52b788"/>
                        </g>

                        <!-- Tree 2 -->
                        <g transform="translate(860, 240)">
                            <polygon points="0,-45 -20,-12 0,-6" fill="#2d6a4f"/>
                            <polygon points="0,-45 0,-6 20,-12" fill="#40916c"/>
                            <polygon points="0,-68 -15,-36 0,-32" fill="#40916c"/>
                            <polygon points="0,-68 0,-32 15,-36" fill="#52b788"/>
                        </g>

                        <!-- Tree 3 -->
                        <g transform="translate(420, 480)">
                            <polygon points="0,-36 -16,-10 0,-5" fill="#2d6a4f"/>
                            <polygon points="0,-36 0,-5 16,-10" fill="#40916c"/>
                            <polygon points="0,-55 -12,-28 0,-24" fill="#40916c"/>
                            <polygon points="0,-55 0,-24 12,-28" fill="#52b788"/>
                        </g>

                        <!-- Tree 4 -->
                        <g transform="translate(980, 420)">
                            <polygon points="0,-42 -18,-10 0,-5" fill="#2d6a4f"/>
                            <polygon points="0,-42 0,-5 18,-10" fill="#40916c"/>
                            <polygon points="0,-64 -14,-32 0,-28" fill="#40916c"/>
                            <polygon points="0,-64 0,-28 14,-32" fill="#52b788"/>
                        </g>
                    </g>
                </g>

                <!-- ================= 2. 背景元素：兵马俑军阵方队 ================= -->
                <g id="terracotta-army" transform="translate(180, 160)">
                    <!-- 方阵1 -->
                    <!-- 排列整齐的低多边形兵马俑士兵 -->
                    <g transform="translate(0, 0)">
                        <!-- 士兵模型生成宏 -->
                        <g transform="translate(400, 100)">
                            <!-- 兵马俑 1 -->
                            <polygon points="-6,-18 6,-18 4,-10 -4,-10" fill="#8c5836"/>
                            <polygon points="-8,-10 8,-10 6,10 -6,10" fill="url(#terracotta)"/>
                            <polygon points="-4,-24 4,-24 0,-18" fill="#5c381e"/> <!-- 发髻 -->
                        </g>
                        <g transform="translate(435, 120)">
                            <polygon points="-6,-18 6,-18 4,-10 -4,-10" fill="#8c5836"/>
                            <polygon points="-8,-10 8,-10 6,10 -6,10" fill="url(#terracotta)"/>
                            <polygon points="-4,-24 4,-24 0,-18" fill="#5c381e"/>
                        </g>
                        <g transform="translate(470, 140)">
                            <polygon points="-6,-18 6,-18 4,-10 -4,-10" fill="#8c5836"/>
                            <polygon points="-8,-10 8,-10 6,10 -6,10" fill="url(#terracotta)"/>
                            <polygon points="-4,-24 4,-24 0,-18" fill="#5c381e"/>
                        </g>
                        <g transform="translate(505, 160)">
                            <polygon points="-6,-18 6,-18 4,-10 -4,-10" fill="#8c5836"/>
                            <polygon points="-8,-10 8,-10 6,10 -6,10" fill="url(#terracotta)"/>
                            <polygon points="-4,-24 4,-24 0,-18" fill="#5c381e"/>
                        </g>

                        <!-- 第二排兵马俑 -->
                        <g transform="translate(440, 80)">
                            <polygon points="-6,-18 6,-18 4,-10 -4,-10" fill="#8c5836"/>
                            <polygon points="-8,-10 8,-10 6,10 -6,10" fill="url(#terracotta)"/>
                            <polygon points="-4,-24 4,-24 0,-18" fill="#5c381e"/>
                        </g>
                        <g transform="translate(475, 100)">
                            <polygon points="-6,-18 6,-18 4,-10 -4,-10" fill="#8c5836"/>
                            <polygon points="-8,-10 8,-10 6,10 -6,10" fill="url(#terracotta)"/>
                            <polygon points="-4,-24 4,-24 0,-18" fill="#5c381e"/>
                        </g>
                        <g transform="translate(510, 120)">
                            <polygon points="-6,-18 6,-18 4,-10 -4,-10" fill="#8c5836"/>
                            <polygon points="-8,-10 8,-10 6,10 -6,10" fill="url(#terracotta)"/>
                            <polygon points="-4,-24 4,-24 0,-18" fill="#5c381e"/>
                        </g>
                        <g transform="translate(545, 140)">
                            <polygon points="-6,-18 6,-18 4,-10 -4,-10" fill="#8c5836"/>
                            <polygon points="-8,-10 8,-10 6,10 -6,10" fill="url(#terracotta)"/>
                            <polygon points="-4,-24 4,-24 0,-18" fill="#5c381e"/>
                        </g>

                        <!-- 第三排兵马俑 -->
                        <g transform="translate(480, 60)">
                            <polygon points="-6,-18 6,-18 4,-10 -4,-10" fill="#8c5836"/>
                            <polygon points="-8,-10 8,-10 6,10 -6,10" fill="url(#terracotta)"/>
                            <polygon points="-4,-24 4,-24 0,-18" fill="#5c381e"/>
                        </g>
                        <g transform="translate(515, 80)">
                            <polygon points="-6,-18 6,-18 4,-10 -4,-10" fill="#8c5836"/>
                            <polygon points="-8,-10 8,-10 6,10 -6,10" fill="url(#terracotta)"/>
                            <polygon points="-4,-24 4,-24 0,-18" fill="#5c381e"/>
                        </g>
                        <g transform="translate(550, 100)">
                            <polygon points="-6,-18 6,-18 4,-10 -4,-10" fill="#8c5836"/>
                            <polygon points="-8,-10 8,-10 6,10 -6,10" fill="url(#terracotta)"/>
                            <polygon points="-4,-24 4,-24 0,-18" fill="#5c381e"/>
                        </g>
                        <g transform="translate(585, 120)">
                            <polygon points="-6,-18 6,-18 4,-10 -4,-10" fill="#8c5836"/>
                            <polygon points="-8,-10 8,-10 6,10 -6,10" fill="url(#terracotta)"/>
                            <polygon points="-4,-24 4,-24 0,-18" fill="#5c381e"/>
                        </g>
                    </g>
                </g>

                <!-- ================= 3. 铁轨系统 (Railway Tracks) ================= -->
                <g id="tracks-group" transform="translate(0, 80)">
                    <!-- 枕木 (等距排布) -->
                    <g id="ties" stroke="#5c4033" stroke-width="6">
                        <line x1="120" y1="470" x2="180" y2="505" />
                        <line x1="200" y1="425" x2="260" y2="460" />
                        <line x1="280" y1="380" x2="340" y2="415" />
                        <line x1="360" y1="335" x2="420" y2="370" />
                        <line x1="440" y1="290" x2="500" y2="325" />
                        <line x1="520" y1="245" x2="580" y2="280" />
                        <line x1="600" y1="200" x2="660" y2="235" />
                        <line x1="680" y1="155" x2="740" y2="190" />
                        <line x1="760" y1="110" x2="820" y2="145" />
                        <line x1="840" y1="65"  x2="900" y2="100" />
                        <line x1="920" y1="20"  x2="980" y2="55" />
                        <line x1="1000" y1="-25" x2="1060" y2="10" />
                    </g>
                    <!-- 两条主钢轨 (金钢色泽) -->
                    <path d="M 80,480 L 1080,-70" stroke="#71717a" stroke-width="4.5" />
                    <path d="M 140,515 L 1140,-35" stroke="#a1a1aa" stroke-width="4.5" />
                </g>

                <!-- ================= 4. 蒸汽动画 (Steam Animation) ================= -->
                <g id="steam-system">
                    <!-- 团状白色烟雾 -->
                    <circle class="steam-puff puff-1" cx="295" cy="355" r="28" fill="url(#steamGrad)"/>
                    <circle class="steam-puff puff-2" cx="295" cy="355" r="36" fill="url(#steamGrad)"/>
                    <circle class="steam-puff puff-3" cx="295" cy="355" r="44" fill="url(#steamGrad)"/>
                </g>

                <!-- ================= 5. 火车主体：“始皇巡游号” ================= -->
                <!-- 火车整体从右向左行驶：车头在前(左侧)，车厢在后(右侧) -->
                <g id="train-container" class="train-chug">

                    <!-- ---------- 车厢2 (末节车厢) ---------- -->
                    <g id="carriage-2" transform="translate(680, 160)">
                        <!-- 车厢底盘与轮子 -->
                        <g class="bogie" transform="translate(0, 100)">
                            <!-- 车轮 1 -->
                            <g class="wheel-rotate" transform="translate(30, 20)">
                                <circle cx="0" cy="0" r="16" fill="#18181b" stroke="url(#goldGrad)" stroke-width="3"/>
                                <line x1="-16" y1="0" x2="16" y2="0" stroke="#ffd700" stroke-width="2"/>
                                <line x1="0" y1="-16" x2="0" y2="16" stroke="#ffd700" stroke-width="2"/>
                            </g>
                            <!-- 车轮 2 -->
                            <g class="wheel-rotate" transform="translate(100, -20)">
                                <circle cx="0" cy="0" r="16" fill="#18181b" stroke="url(#goldGrad)" stroke-width="3"/>
                                <line x1="-16" y1="0" x2="16" y2="0" stroke="#ffd700" stroke-width="2"/>
                                <line x1="0" y1="-16" x2="0" y2="16" stroke="#ffd700" stroke-width="2"/>
                            </g>
                        </g>
                        <!-- 大秦朱红车身 -->
                        <polygon points="0,90 140,10 140,-50 0,30" fill="url(#imperialRed)" stroke="#ffd700" stroke-width="2.5"/>
                        <!-- 金色边框窗户 -->
                        <polygon points="15,65 55,42 55,10 15,33" fill="#fef08a" stroke="#ffd700" stroke-width="2" opacity="0.9"/>
                        <polygon points="75,31 115,8 115,-24 75,-1" fill="#fef08a" stroke="#ffd700" stroke-width="2" opacity="0.9"/>
                        <!-- 中式古建飞檐车顶 (Upturned Eaves Roof) -->
                        <polygon points="-12,32 152,-62 135,-80 -30,14" fill="url(#roofDark)" stroke="#ffd700" stroke-width="2.5"/>
                        <!-- 飞檐翘角 -->
                        <path d="M -12,32 Q -30,36 -38,20 Q -24,20 -15,25 Z" fill="#ffd700"/>
                        <path d="M 152,-62 Q 170,-58 178,-74 Q 164,-74 155,-69 Z" fill="#ffd700"/>
                    </g>

                    <!-- ---------- 车厢1 (中节车厢) ---------- -->
                    <g id="carriage-1" transform="translate(500, 260)">
                        <!-- 车轮 -->
                        <g class="bogie" transform="translate(0, 100)">
                            <g class="wheel-rotate" transform="translate(30, 20)">
                                <circle cx="0" cy="0" r="16" fill="#18181b" stroke="url(#goldGrad)" stroke-width="3"/>
                                <line x1="-16" y1="0" x2="16" y2="0" stroke="#ffd700" stroke-width="2"/>
                                <line x1="0" y1="-16" x2="0" y2="16" stroke="#ffd700" stroke-width="2"/>
                            </g>
                            <g class="wheel-rotate" transform="translate(100, -20)">
                                <circle cx="0" cy="0" r="16" fill="#18181b" stroke="url(#goldGrad)" stroke-width="3"/>
                                <line x1="-16" y1="0" x2="16" y2="0" stroke="#ffd700" stroke-width="2"/>
                                <line x1="0" y1="-16" x2="0" y2="16" stroke="#ffd700" stroke-width="2"/>
                            </g>
                        </g>
                        <!-- 朱红车体 -->
                        <polygon points="0,90 140,10 140,-50 0,30" fill="url(#imperialRed)" stroke="#ffd700" stroke-width="2.5"/>
                        <!-- 车窗 -->
                        <polygon points="15,65 55,42 55,10 15,33" fill="#fef08a" stroke="#ffd700" stroke-width="2" opacity="0.9"/>
                        <polygon points="75,31 115,8 115,-24 75,-1" fill="#fef08a" stroke="#ffd700" stroke-width="2" opacity="0.9"/>
                        <!-- 中式飞檐车顶 -->
                        <polygon points="-12,32 152,-62 135,-80 -30,14" fill="url(#roofDark)" stroke="#ffd700" stroke-width="2.5"/>
                        <path d="M -12,32 Q -30,36 -38,20 Q -24,20 -15,25 Z" fill="#ffd700"/>
                        <path d="M 152,-62 Q 170,-58 178,-74 Q 164,-74 155,-69 Z" fill="#ffd700"/>
                    </g>

                    <!-- ---------- 煤水车 (Tender) ---------- -->
                    <g id="tender" transform="translate(400, 320)">
                        <polygon points="0,75 80,30 80,-15 0,30" fill="url(#bodyBlack)" stroke="#ffd700" stroke-width="2"/>
                        <!-- 黑色低多边形煤炭堆 -->
                        <polygon points="5,25 40,-5 75,-12 40,10" fill="#090a0f"/>
                        <!-- 煤水车轮 -->
                        <g class="wheel-rotate" transform="translate(25, 90)">
                            <circle cx="0" cy="0" r="14" fill="#18181b" stroke="url(#goldGrad)" stroke-width="2.5"/>
                            <line x1="-14" y1="0" x2="14" y2="0" stroke="#ffd700" stroke-width="1.5"/>
                            <line x1="0" y1="-14" x2="0" y2="14" stroke="#ffd700" stroke-width="1.5"/>
                        </g>
                        <g class="wheel-rotate" transform="translate(65, 65)">
                            <circle cx="0" cy="0" r="14" fill="#18181b" stroke="url(#goldGrad)" stroke-width="2.5"/>
                            <line x1="-14" y1="0" x2="14" y2="0" stroke="#ffd700" stroke-width="1.5"/>
                            <line x1="0" y1="-14" x2="0" y2="14" stroke="#ffd700" stroke-width="1.5"/>
                        </g>
                    </g>

                    <!-- ---------- 蒸汽机车车头 (Locomotive) ---------- -->
                    <g id="locomotive" transform="translate(200, 435)">
                        <!-- 主驱动大轮组 (Large Drive Wheels with Rods) -->
                        <g id="driver-wheels">
                            <g class="wheel-rotate" transform="translate(50, 45)">
                                <circle cx="0" cy="0" r="22" fill="#18181b" stroke="url(#goldGrad)" stroke-width="4"/>
                                <line x1="-22" y1="0" x2="22" y2="0" stroke="#ffd700" stroke-width="2.5"/>
                                <line x1="0" y1="-22" x2="0" y2="22" stroke="#ffd700" stroke-width="2.5"/>
                                <line x1="-15" y1="-15" x2="15" y2="15" stroke="#ffd700" stroke-width="2"/>
                                <line x1="-15" y1="15" x2="15" y2="-15" stroke="#ffd700" stroke-width="2"/>
                            </g>
                            <g class="wheel-rotate" transform="translate(110, 10)">
                                <circle cx="0" cy="0" r="22" fill="#18181b" stroke="url(#goldGrad)" stroke-width="4"/>
                                <line x1="-22" y1="0" x2="22" y2="0" stroke="#ffd700" stroke-width="2.5"/>
                                <line x1="0" y1="-22" x2="0" y2="22" stroke="#ffd700" stroke-width="2.5"/>
                                <line x1="-15" y1="-15" x2="15" y2="15" stroke="#ffd700" stroke-width="2"/>
                                <line x1="-15" y1="15" x2="15" y2="-15" stroke="#ffd700" stroke-width="2"/>
                            </g>
                            <g class="wheel-rotate" transform="translate(165, -20)">
                                <circle cx="0" cy="0" r="18" fill="#18181b" stroke="url(#goldGrad)" stroke-width="3"/>
                                <line x1="-18" y1="0" x2="18" y2="0" stroke="#ffd700" stroke-width="2"/>
                                <line x1="0" y1="-18" x2="0" y2="18" stroke="#ffd700" stroke-width="2"/>
                            </g>
                        </g>

                        <!-- 车头锅炉主体 (黑色 + 金色饰边) -->
                        <polygon points="0,35 180,-70 180,-140 0,-35" fill="url(#bodyBlack)" stroke="url(#goldGrad)" stroke-width="3.5"/>

                        <!-- 驾驶舱 (Cab) -->
                        <polygon points="120,-35 190,-75 190,-165 120,-125" fill="#1f242d" stroke="url(#goldGrad)" stroke-width="3"/>
                        <polygon points="135,-65 175,-88 175,-130 135,-107" fill="#fef08a" stroke="#ffd700" stroke-width="2" opacity="0.85"/>

                        <!-- 烟囱 (Chimney / Smokestack) -->
                        <polygon points="25,-20 45,-32 45,-100 25,-88" fill="#111827" stroke="url(#goldGrad)" stroke-width="2"/>
                        <!-- 烟囱金色顶盖 -->
                        <polygon points="20,-88 50,-105 52,-112 18,-95" fill="url(#goldGrad)"/>

                        <!-- 车前探照车灯 (Golden Headlight) -->
                        <polygon points="-12,30 5,20 5,-5 -12,5" fill="#ffd700" stroke="#b45309" stroke-width="2"/>
                        <!-- 探照灯光锥 -->
                        <polygon points="-12,18 -180,105 -130,135 5,7" fill="#fef08a" opacity="0.35"/>

                        <!-- 排障器 (Cowcatcher / Pilot) -->
                        <polygon points="-25,45 15,22 15,40 -15,58" fill="#d97706" stroke="#b45309" stroke-width="2"/>

                        <!-- 侧面圆形“秦”字徽章 (Imperial Qin Seal Badge) -->
                        <g id="qin-badge" transform="translate(85, -50)">
                            <!-- 金色圆形双层外框 -->
                            <circle cx="0" cy="0" r="22" fill="#991b1b" stroke="url(#goldGrad)" stroke-width="3.5"/>
                            <circle cx="0" cy="0" r="18" fill="none" stroke="#ffd700" stroke-width="1.5" stroke-dasharray="3,2"/>
                            <!-- 篆体/金文“秦”字 -->
                            <text x="0" y="7" font-size="20" font-family="'STKaiti', 'KaiTi', 'SimSun', serif" font-weight="900" fill="#ffd700" text-anchor="middle">秦</text>
                        </g>
                    </g>

                </g>
            </svg>
        </div>
    </div>

    <script>
        // --- 核心交互与动画控制系统 ---
        const stageTransform = document.getElementById('stage-transform');
        const viewport = document.getElementById('scene-viewport');
        const btnPause = document.getElementById('btn-pause');
        const btnWhistle = document.getElementById('btn-whistle');
        const btnSound = document.getElementById('btn-sound');
        const btnCamera = document.getElementById('btn-camera');

        // 状态变量
        let isPaused = false;
        let isSoundOn = false;
        let isDragging = false;
        let startX = 0, startY = 0;
        let currentX = 0, currentY = 0;
        let currentScale = 1.0;
        let currentRotate = 0;

        // --- 1. 暂停 / 继续 功能 ---
        btnPause.addEventListener('click', () => {
            isPaused = !isPaused;
            if (isPaused) {
                document.body.classList.add('paused');
                btnPause.innerText = '▶ 继续';
                btnPause.style.background = 'rgba(34, 197, 94, 0.3)';
                btnPause.style.borderColor = '#22c55e';
            } else {
                document.body.classList.remove('paused');
                btnPause.innerText = '⏸ 暂停';
                btnPause.style.background = 'rgba(239, 68, 68, 0.25)';
                btnPause.style.borderColor = 'rgba(239, 68, 68, 0.4)';
            }
        });

        // --- 2. 鸣笛功能 (视效抖动 + 音符生成 + Web Audio 合成真实汽笛声) ---
        let audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            return audioCtx;
        }

        function playWhistleSound() {
            if (!isSoundOn) return;
            const ctx = getAudioContext();
            if (ctx.state === 'suspended') {
                ctx.resume();
            }

            // 合成双音轨双簧蒸汽汽笛（真实古典和弦 440Hz + 554Hz）
            const freqs = [440, 554.37, 659.25];
            freqs.forEach(freq => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(freq, ctx.currentTime);
                // 模拟滑音
                osc.frequency.exponentialRampToValueAtTime(freq * 1.03, ctx.currentTime + 0.3);
                osc.frequency.exponentialRampToValueAtTime(freq, ctx.currentTime + 1.2);

                gain.gain.setValueAtTime(0.01, ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.08, ctx.currentTime + 0.15);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.3);

                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.start();
                osc.stop(ctx.currentTime + 1.35);
            });
        }

        btnWhistle.addEventListener('click', (e) => {
            // 触发屏幕震动效果
            viewport.classList.remove('screen-shake');
            void viewport.offsetWidth; // 触发 reflow
            viewport.classList.add('screen-shake');
            setTimeout(() => viewport.classList.remove('screen-shake'), 600);

            // 播放汽笛音效
            playWhistleSound();

            // 生成飘扬的金色音符
            const rect = e.target.getBoundingClientRect();
            for (let i = 0; i < 4; i++) {
                setTimeout(() => {
                    const note = document.createElement('div');
                    note.className = 'note-float';
                    note.innerText = ['♪', '♫', '♬', '♩'][Math.floor(Math.random() * 4)];
                    note.style.left = (rect.left + rect.width / 2 + (Math.random() - 0.5) * 40) + 'px';
                    note.style.top = (rect.top - 20) + 'px';
                    document.body.appendChild(note);
                    setTimeout(() => note.remove(), 1200);
                }, i * 120);
            }
        });

        // --- 3. 声音 开/关 切换 ---
        let chugInterval = null;
        function playChugSound() {
            if (!isSoundOn || isPaused) return;
            const ctx = getAudioContext();
            if (ctx.state === 'suspended') ctx.resume();

            // 模拟车轮与蒸汽扑哧白噪音
            const bufferSize = ctx.sampleRate * 0.08;
            const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }

            const noise = ctx.createBufferSource();
            noise.buffer = buffer;

            const filter = ctx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(800, ctx.currentTime);

            const gain = ctx.createGain();
            gain.gain.setValueAtTime(0.04, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.07);

            noise.connect(filter);
            filter.connect(gain);
            gain.connect(ctx.destination);

            noise.start();
        }

        btnSound.addEventListener('click', () => {
            isSoundOn = !isSoundOn;
            if (isSoundOn) {
                btnSound.innerText = '声音：开 🔊';
                btnSound.classList.add('active');
                getAudioContext();
                chugInterval = setInterval(playChugSound, 300);
            } else {
                btnSound.innerText = '声音：关 🔇';
                btnSound.classList.remove('active');
                if (chugInterval) clearInterval(chugInterval);
            }
        });

        // --- 4. 自由视角交互（平移拖拽与滚轮缩放） ---
        function updateTransform() {
            stageTransform.style.transform = `translate(${currentX}px, ${currentY}px) scale(${currentScale}) rotate(${currentRotate}deg)`;
        }

        viewport.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX - currentX;
            startY = e.clientY - currentY;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            currentX = e.clientX - startX;
            currentY = e.clientY - startY;
            updateTransform();
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
        });

        // 滚轮平滑缩放
        viewport.addEventListener('wheel', (e) => {
            e.preventDefault();
            const delta = e.deltaY * -0.0012;
            currentScale = Math.min(Math.max(0.4, currentScale + delta), 2.5);
            updateTransform();
        }, { passive: false });

        // 移动端单指平移与双指缩放
        let touchStartDist = 0;
        let touchStartScale = 1.0;

        viewport.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                isDragging = true;
                startX = e.touches[0].clientX - currentX;
                startY = e.touches[0].clientY - currentY;
            } else if (e.touches.length === 2) {
                isDragging = false;
                touchStartDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                touchStartScale = currentScale;
            }
        }, { passive: true });

        viewport.addEventListener('touchmove', (e) => {
            if (e.touches.length === 1 && isDragging) {
                currentX = e.touches[0].clientX - startX;
                currentY = e.touches[0].clientY - startY;
                updateTransform();
            } else if (e.touches.length === 2 && touchStartDist > 0) {
                const currentDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                const factor = currentDist / touchStartDist;
                currentScale = Math.min(Math.max(0.4, touchStartScale * factor), 2.5);
                updateTransform();
            }
        }, { passive: true });

        viewport.addEventListener('touchend', () => {
            isDragging = false;
            touchStartDist = 0;
        });

        // 复位视角按钮
        btnCamera.addEventListener('click', () => {
            currentX = 0;
            currentY = 0;
            currentScale = 1.0;
            currentRotate = 0;
            stageTransform.style.transition = 'transform 0.5s cubic-bezier(0.16, 1, 0.3, 1)';
            updateTransform();
            setTimeout(() => {
                stageTransform.style.transition = 'transform 0.08s ease-out';
            }, 500);
        });
    </script>
</body>
